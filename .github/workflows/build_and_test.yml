name: Build and Test Multiplatform

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux System Dependencies (Qt / OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: Run Test Suite (pytest)
        run: |
          pytest -v

      - name: Build Standalone Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean A1_Mini_Pen_Plotter.spec
          powershell -ExecutionPolicy Bypass -File scripts/package_release.ps1

      - name: Build Standalone Binary (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build Standalone Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a1-mini-pen-plotter-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: warn
